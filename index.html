<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN AND REGISTER</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<section>
    <div class="login-box">
        <form action="" id="loginForm">
            <h2>Login</h2>
            <div class="input-box">
                <span class="icon"><ion-icon name="mail"></ion-icon></span>
                <input type="email" required placeholder=" ">
                <label>Email</label>
            </div>
            <div class="input-box">
                <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                <input type="password" required placeholder=" ">
                <label>Password</label>
            </div>
            <div class="remember-forgot">
                <label>
                    <input type="checkbox">Remember me</label>
                <a href="#" onclick="showForgot(); return false;">Forgot Password?</a>
            </div>
            <button type="submit">Login</button>
            <div class="register-link">
                <p>Don't have an account? <a href="#" onclick="showRegister(); return false;">Register</a></p>
            </div>
        </form>
    </div>
    <div class="login-box" id="registerBox" style="display: none;">
        <form action="" id="registerForm">
            <h2>Register</h2>
            <div class="input-box">
                <span class="icon"><ion-icon name="person"></ion-icon></span>
                <input type="text" required placeholder=" ">
                <label>Full Name</label>
            </div>
            <div class="input-box">
                <span class="icon"><ion-icon name="mail"></ion-icon></span>
                <input type="email" required placeholder=" ">
                <label>Email</label>
            </div>
            <div class="input-box">
                <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                <input type="password" required placeholder=" ">
                <label>Password</label>
            </div>
            <button type="submit">Register</button>
            <div class="register-link">
                <p>Already have an account? <a href="#" onclick="showLogin(); return false;">Login</a></p>
            </div>
        </form>
    </div>
    <div class="login-box" id="forgotBox" style="display: none;">
        <form action="" id="forgotForm">
            <h2>Forgot Password</h2>
            <div class="input-box">
                <span class="icon"><ion-icon name="mail"></ion-icon></span>
                <input type="email" required placeholder=" ">
                <label>Enter your Email</label>
            </div>
            <button type="submit">Continue</button>
            <div class="register-link">
                <p><a href="#" onclick="showLogin(); return false;">Back to Login</a></p>
            </div>
        </form>
    </div>
</section>
<script>
    function showRegister() {
        document.getElementById('loginForm').closest('.login-box').style.display = 'none';
        document.getElementById('forgotBox').style.display = 'none';
        document.getElementById('registerBox').style.display = 'flex';
    }
    function showLogin() {
        document.getElementById('registerBox').style.display = 'none';
        document.getElementById('forgotBox').style.display = 'none';
        document.getElementById('loginForm').closest('.login-box').style.display = 'flex';
    }
    function showForgot() {
        document.getElementById('loginForm').closest('.login-box').style.display = 'none';
        document.getElementById('registerBox').style.display = 'none';
        document.getElementById('forgotBox').style.display = 'flex';
    }
</script>

<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
